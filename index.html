<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #0F1720;
    --surface: #17212C;
    --surface-alt: #1E2A37;
    --border: #2A3846;
    --text: #E7EDF3;
    --text-dim: #8FA0B3;
    --text-faint: #5E7085;
    --ok: #37D6A1;
    --ok-bg: rgba(55,214,161,0.12);
    --bad: #FF6E63;
    --bad-bg: rgba(255,110,99,0.12);
    --accent: #4FA3E3;
    --accent-dim: rgba(79,163,227,0.14);
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans Arabic', 'Cairo', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; direction:rtl; font-family:var(--sans);
    background:
      radial-gradient(1100px 600px at 85% -10%, rgba(79,163,227,0.08), transparent 60%),
      var(--bg);
    color:var(--text); min-height:100vh; padding:28px 20px 60px;
  }
  .wrap{max-width:1180px; margin:0 auto;}

  /* Header */
  .header{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:22px; flex-wrap:wrap;}
  .header h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:0.2px;}
  .header p{margin:0; color:var(--text-dim); font-size:13.5px;}
  .brand-mark{display:inline-flex; align-items:center; gap:10px;}
  .brand-dot{width:9px; height:9px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 4px var(--ok-bg); flex:none;}

  .btn{
    border:1px solid var(--border); background:var(--surface-alt); color:var(--text);
    padding:10px 18px; border-radius:9px; font-family:var(--sans); font-size:13.5px;
    cursor:pointer; transition:.15s ease; font-weight:600;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent);}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#08161F;}
  .btn-primary:hover{background:#65b3ea; color:#08161F; filter:none;}
  .btn-danger-ghost{color:var(--bad); border-color:transparent; background:transparent; padding:6px 10px; font-size:12.5px;}
  .btn-danger-ghost:hover{background:var(--bad-bg); border-color:transparent;}
  .btn-ghost{background:transparent; border-color:transparent; padding:6px 10px; font-size:12.5px;}
  .btn-ghost:hover{background:var(--surface-alt); border-color:transparent; color:var(--text);}

  /* Stats */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
  .stat{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px;}
  .stat .n{font-family:var(--mono); font-size:26px; font-weight:600; line-height:1;}
  .stat .l{color:var(--text-dim); font-size:12.5px; margin-top:8px;}
  .stat.ok .n{color:var(--ok);}
  .stat.bad .n{color:var(--bad);}

  /* Toolbar */
  .toolbar{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;}
  .search{
    flex:1; min-width:200px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:10px 14px; color:var(--text); font-family:var(--sans); font-size:13.5px;
  }
  .search:focus{outline:none; border-color:var(--accent);}
  select.filter{
    background:var(--surface); border:1px solid var(--border); border-radius:9px;
    color:var(--text-dim); padding:10px 12px; font-family:var(--sans); font-size:13px; cursor:pointer;
  }
  select.filter:focus{outline:none; border-color:var(--accent);}

  /* Table */
  .table-card{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden;}
  table{width:100%; border-collapse:collapse; font-size:13.2px;}
  thead th{
    text-align:right; padding:12px 14px; color:var(--text-faint); font-weight:600;
    font-size:11.5px; border-bottom:1px solid var(--border); white-space:nowrap;
  }
  tbody td{padding:13px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s;}
  tbody tr:hover{background:var(--surface-alt); cursor:pointer;}
  .ip{font-family:var(--mono); color:var(--accent); font-size:13px;}
  .muted{color:var(--text-dim);}
  .status-pill{
    display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:100px;
    font-size:11.5px; font-weight:600; white-space:nowrap;
  }
  .status-pill.ok{background:var(--ok-bg); color:var(--ok);}
  .status-pill.bad{background:var(--bad-bg); color:var(--bad);}
  .status-pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor;}
  .type-chip{
    font-family:var(--mono); font-size:11.5px; color:var(--text-dim); border:1px solid var(--border);
    padding:2px 8px; border-radius:6px;
  }
  .row-actions{display:flex; gap:4px; justify-content:flex-end;}
  .empty{padding:60px 20px; text-align:center; color:var(--text-faint);}
  .empty b{color:var(--text-dim); display:block; margin-bottom:6px; font-size:14px;}

  /* Modal */
  .overlay{
    position:fixed; inset:0; background:rgba(6,10,14,0.65); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .modal{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:26px 26px 22px;
  }
  .modal h2{margin:0 0 4px; font-size:17px;}
  .modal .sub{color:var(--text-dim); font-size:12.5px; margin:0 0 20px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .field{display:flex; flex-direction:column; gap:6px;}
  .field.span2{grid-column:1 / -1;}
  .field label{font-size:12px; color:var(--text-dim); font-weight:600;}
  .field input, .field select{
    background:var(--surface-alt); border:1px solid var(--border); border-radius:8px;
    padding:9px 12px; color:var(--text); font-family:var(--sans); font-size:13.5px;
  }
  .field input[data-mono="1"]{font-family:var(--mono); direction:ltr; text-align:right;}
  .field input:focus, .field select:focus{outline:none; border-color:var(--accent);}
  .status-toggle{display:flex; gap:8px;}
  .status-toggle button{
    flex:1; padding:9px; border-radius:8px; border:1px solid var(--border); background:var(--surface-alt);
    color:var(--text-dim); font-family:var(--sans); font-size:13px; cursor:pointer; font-weight:600;
  }
  .status-toggle button.active.ok{background:var(--ok-bg); color:var(--ok); border-color:var(--ok);}
  .status-toggle button.active.bad{background:var(--bad-bg); color:var(--bad); border-color:var(--bad);}
  .modal-footer{display:flex; justify-content:flex-end; gap:10px; margin-top:22px; padding-top:16px; border-top:1px solid var(--border);}
  .pw-wrap{position:relative;}
  .pw-wrap input{width:100%; padding-left:38px;}
  .pw-toggle{position:absolute; left:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--text-faint); cursor:pointer; font-size:12px; padding:2px 4px;}

  /* Detail view */
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:2px 22px;}
  .detail-item{padding:10px 0; border-bottom:1px solid var(--border);}
  .detail-item .k{font-size:11.5px; color:var(--text-faint); margin-bottom:4px;}
  .detail-item .v{font-size:13.5px;}
  .detail-item .v.mono{font-family:var(--mono); direction:ltr; text-align:right;}

  @media (max-width:720px){
    .stats{grid-template-columns:1fr 1fr;}
    .form-grid{grid-template-columns:1fr;}
    .detail-grid{grid-template-columns:1fr;}
    table, thead, tbody, tr{display:block;}
    thead{display:none;}
    tbody tr{border-bottom:1px solid var(--border); padding:10px 4px;}
    tbody td{border:none; padding:4px 10px; display:flex; justify-content:space-between; gap:10px;}
    tbody td:before{content:attr(data-label); color:var(--text-faint); font-size:11px;}
  }
</style>

<div class="wrap">
  <div class="header">
    <div>
      <div class="brand-mark"><span class="brand-dot"></span><h1>سجل كاميرات المراقبة</h1></div>
      <p>إدارة بيانات الكاميرات، الشبكة، والحالة التشغيلية</p>
    </div>
    <div style="display:flex; gap:10px;">
      <button class="btn" id="exportBtn" onclick="exportToExcel()">تنزيل Excel</button>
      <button class="btn btn-primary" onclick="openModal()">+ إضافة كاميرا</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="statTotal">0</div><div class="l">إجمالي الكاميرات</div></div>
    <div class="stat ok"><div class="n" id="statOk">0</div><div class="l">تعمل</div></div>
    <div class="stat bad"><div class="n" id="statBad">0</div><div class="l">لا تعمل</div></div>
    <div class="stat"><div class="n" id="statCompanies">0</div><div class="l">عدد الشركات</div></div>
  </div>

  <div class="toolbar">
    <input class="search" id="searchInput" placeholder="ابحث بالـ IP، الشركة، المنطقة، الموقع، الراك..." oninput="render()">
    <select class="filter" id="filterCompany" onchange="render()"><option value="">كل الشركات</option></select>
    <select class="filter" id="filterStatus" onchange="render()">
      <option value="">كل الحالات</option>
      <option value="Working">تعمل</option>
      <option value="Not Working">لا تعمل</option>
    </select>
    <select class="filter" id="filterType" onchange="render()">
      <option value="">كل الأنواع</option>
      <option value="2MP">2MP</option>
      <option value="4MP">4MP</option>
      <option value="8MP">8MP</option>
    </select>
  </div>

  <div class="table-card">
    <table id="cameraTable">
      <thead>
        <tr>
          <th>الحالة</th>
          <th>عنوان IP</th>
          <th>الشركة</th>
          <th>منطقة الكاميرا</th>
          <th>موقع الكاميرا</th>
          <th>الراك</th>
          <th>النوع</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">
      <b>لا توجد كاميرات مسجلة بعد</b>
      اضغط "إضافة كاميرا" لبدء بناء السجل
    </div>
  </div>
</div>

<script>
let cameras = [];
let editingId = null;

const uid = () => 'cam_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);

async function loadCameras(){
  try{
    const res = await window.storage.get('cameras_list');
    cameras = res ? JSON.parse(res.value) : [];
  }catch(e){
    cameras = [];
  }
  render();
}

async function saveCameras(){
  try{
    await window.storage.set('cameras_list', JSON.stringify(cameras));
  }catch(e){
    console.error('فشل حفظ البيانات', e);
  }
}

function statusPill(status){
  const ok = status === 'Working';
  return `<span class="status-pill ${ok?'ok':'bad'}"><span class="dot"></span>${ok?'تعمل':'لا تعمل'}</span>`;
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const fCompany = document.getElementById('filterCompany').value;
  const fStatus = document.getElementById('filterStatus').value;
  const fType = document.getElementById('filterType').value;

  // populate company filter options
  const companySelect = document.getElementById('filterCompany');
  const companies = [...new Set(cameras.map(c => c.company).filter(Boolean))].sort();
  const currentVal = companySelect.value;
  companySelect.innerHTML = '<option value="">كل الشركات</option>' + companies.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
  companySelect.value = currentVal;

  let filtered = cameras.filter(c => {
    if(fCompany && c.company !== fCompany) return false;
    if(fStatus && c.status !== fStatus) return false;
    if(fType && c.type !== fType) return false;
    if(q){
      const hay = [c.ip,c.company,c.area,c.location,c.rackName,c.rackLocation].join(' ').toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });

  const tbody = document.getElementById('tableBody');
  const emptyState = document.getElementById('emptyState');

  if(filtered.length === 0){
    tbody.innerHTML = '';
    emptyState.style.display = 'block';
    emptyState.querySelector('b').textContent = cameras.length === 0 ? 'لا توجد كاميرات مسجلة بعد' : 'لا توجد نتائج مطابقة';
  } else {
    emptyState.style.display = 'none';
    tbody.innerHTML = filtered.map(c => `
      <tr onclick="viewDetail('${c.id}')">
        <td data-label="الحالة">${statusPill(c.status)}</td>
        <td data-label="IP" class="ip">${escapeHtml(c.ip || '—')}</td>
        <td data-label="الشركة">${escapeHtml(c.company || '—')}</td>
        <td data-label="المنطقة" class="muted">${escapeHtml(c.area || '—')}</td>
        <td data-label="الموقع" class="muted">${escapeHtml(c.location || '—')}</td>
        <td data-label="الراك" class="muted">${escapeHtml(c.rackName || '—')}</td>
        <td data-label="النوع"><span class="type-chip">${escapeHtml(c.type || '—')}</span></td>
        <td data-label="" onclick="event.stopPropagation()">
          <div class="row-actions">
            <button class="btn btn-ghost" onclick="openModal('${c.id}')">تعديل</button>
            <button class="btn btn-danger-ghost" onclick="deleteCamera('${c.id}')">حذف</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  document.getElementById('statTotal').textContent = cameras.length;
  document.getElementById('statOk').textContent = cameras.filter(c=>c.status==='Working').length;
  document.getElementById('statBad').textContent = cameras.filter(c=>c.status==='Not Working').length;
  document.getElementById('statCompanies').textContent = new Set(cameras.map(c=>c.company).filter(Boolean)).size;
}

function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function openModal(id){
  editingId = id || null;
  const c = id ? cameras.find(x => x.id === id) : null;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${c ? 'تعديل بيانات الكاميرا' : 'إضافة كاميرا جديدة'}</h2>
      <p class="sub">أدخل التفاصيل الشبكية والموقعية للكاميرا</p>
      <div class="form-grid">
        <div class="field"><label>عنوان IP</label><input id="f_ip" data-mono="1" placeholder="192.168.1.10" value="${escapeHtml(c?.ip)}"></div>
        <div class="field"><label>الشركة</label><input id="f_company" placeholder="اسم الشركة" value="${escapeHtml(c?.company)}"></div>
        <div class="field"><label>منطقة الكاميرا</label><input id="f_area" placeholder="مثال: المدخل الرئيسي" value="${escapeHtml(c?.area)}"></div>
        <div class="field"><label>موقع الكاميرا</label><input id="f_location" placeholder="وصف الموقع" value="${escapeHtml(c?.location)}"></div>
        <div class="field"><label>اسم الراك</label><input id="f_rackName" placeholder="Rack A1" value="${escapeHtml(c?.rackName)}"></div>
        <div class="field"><label>موقع الراك</label><input id="f_rackLocation" placeholder="غرفة الشبكة الرئيسية" value="${escapeHtml(c?.rackLocation)}"></div>
        <div class="field"><label>Subnet Mask</label><input id="f_subnet" data-mono="1" placeholder="255.255.255.0" value="${escapeHtml(c?.subnet)}"></div>
        <div class="field"><label>Gateway</label><input id="f_gateway" data-mono="1" placeholder="192.168.1.1" value="${escapeHtml(c?.gateway)}"></div>
        <div class="field"><label>النوع</label>
          <select id="f_type">
            <option value="2MP" ${c?.type==='2MP'?'selected':''}>2MP</option>
            <option value="4MP" ${c?.type==='4MP'?'selected':''}>4MP</option>
            <option value="8MP" ${c?.type==='8MP'?'selected':''}>8MP</option>
          </select>
        </div>
        <div class="field"><label>اسم المستخدم</label><input id="f_user" data-mono="1" placeholder="admin" value="${escapeHtml(c?.user)}"></div>
        <div class="field"><label>كلمة المرور</label>
          <div class="pw-wrap">
            <input id="f_password" type="password" data-mono="1" placeholder="••••••••" value="${escapeHtml(c?.password)}">
            <button type="button" class="pw-toggle" onclick="togglePw()">عرض</button>
          </div>
        </div>
        <div class="field span2">
          <label>حالة الكاميرا</label>
          <div class="status-toggle">
            <button type="button" id="btnOk" class="${(!c || c?.status==='Working')?'active ok':''}" onclick="setStatus('Working')">تعمل</button>
            <button type="button" id="btnBad" class="${c?.status==='Not Working'?'active bad':''}" onclick="setStatus('Not Working')">لا تعمل</button>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">إلغاء</button>
        <button class="btn btn-primary" onclick="submitCamera()">${c ? 'حفظ التعديلات' : 'إضافة الكاميرا'}</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
  window._currentStatus = c?.status || 'Working';
}

function setStatus(s){
  window._currentStatus = s;
  document.getElementById('btnOk').className = s==='Working' ? 'active ok' : '';
  document.getElementById('btnBad').className = s==='Not Working' ? 'active bad' : '';
}

function togglePw(){
  const input = document.getElementById('f_password');
  const btn = document.querySelector('.pw-toggle');
  if(input.type === 'password'){ input.type='text'; btn.textContent='إخفاء'; }
  else { input.type='password'; btn.textContent='عرض'; }
}

function closeModal(){
  const overlay = document.getElementById('modalOverlay');
  if(overlay) overlay.remove();
  editingId = null;
}

async function submitCamera(){
  const data = {
    ip: document.getElementById('f_ip').value.trim(),
    company: document.getElementById('f_company').value.trim(),
    area: document.getElementById('f_area').value.trim(),
    location: document.getElementById('f_location').value.trim(),
    rackName: document.getElementById('f_rackName').value.trim(),
    rackLocation: document.getElementById('f_rackLocation').value.trim(),
    subnet: document.getElementById('f_subnet').value.trim(),
    gateway: document.getElementById('f_gateway').value.trim(),
    type: document.getElementById('f_type').value,
    user: document.getElementById('f_user').value.trim(),
    password: document.getElementById('f_password').value,
    status: window._currentStatus || 'Working',
  };

  if(!data.ip){
    alert('الرجاء إدخال عنوان IP');
    return;
  }

  if(editingId){
    const idx = cameras.findIndex(c => c.id === editingId);
    if(idx > -1) cameras[idx] = { ...cameras[idx], ...data };
  } else {
    cameras.push({ id: uid(), ...data });
  }

  await saveCameras();
  closeModal();
  render();
}

async function deleteCamera(id){
  if(!confirm('هل تريد حذف هذه الكاميرا من السجل؟')) return;
  cameras = cameras.filter(c => c.id !== id);
  await saveCameras();
  render();
}

function viewDetail(id){
  const c = cameras.find(x => x.id === id);
  if(!c) return;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'detailOverlay';
  const rows = [
    ['الحالة', statusPill(c.status), false],
    ['عنوان IP', c.ip, true],
    ['الشركة', c.company, false],
    ['منطقة الكاميرا', c.area, false],
    ['موقع الكاميرا', c.location, false],
    ['اسم الراك', c.rackName, false],
    ['موقع الراك', c.rackLocation, false],
    ['Subnet Mask', c.subnet, true],
    ['Gateway', c.gateway, true],
    ['النوع', c.type, false],
    ['اسم المستخدم', c.user, true],
    ['كلمة المرور', c.password ? '••••••••' : '—', false],
  ];
  overlay.innerHTML = `
    <div class="modal">
      <h2>تفاصيل الكاميرا</h2>
      <p class="sub">${escapeHtml(c.ip)}</p>
      <div class="detail-grid">
        ${rows.map(([k,v,mono]) => `
          <div class="detail-item">
            <div class="k">${k}</div>
            <div class="v ${mono?'mono':''}">${mono ? escapeHtml(v || '—') : (v || '—')}</div>
          </div>
        `).join('')}
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="document.getElementById('detailOverlay').remove()">إغلاق</button>
        <button class="btn btn-primary" onclick="document.getElementById('detailOverlay').remove(); openModal('${c.id}')">تعديل</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if(e.target === overlay) overlay.remove(); });
}

function exportToExcel(){
  if(cameras.length === 0){
    alert('لا توجد بيانات لتصديرها بعد');
    return;
  }

  const headers = [
    'عنوان IP', 'الشركة', 'منطقة الكاميرا', 'موقع الكاميرا',
    'اسم الراك', 'موقع الراك', 'Subnet Mask', 'Gateway',
    'النوع', 'اسم المستخدم', 'كلمة المرور', 'الحالة'
  ];

  const rows = cameras.map(c => ({
    'عنوان IP': c.ip || '',
    'الشركة': c.company || '',
    'منطقة الكاميرا': c.area || '',
    'موقع الكاميرا': c.location || '',
    'اسم الراك': c.rackName || '',
    'موقع الراك': c.rackLocation || '',
    'Subnet Mask': c.subnet || '',
    'Gateway': c.gateway || '',
    'النوع': c.type || '',
    'اسم المستخدم': c.user || '',
    'كلمة المرور': c.password || '',
    'الحالة': c.status === 'Working' ? 'تعمل' : 'لا تعمل',
  }));

  const ws = XLSX.utils.json_to_sheet(rows, { header: headers });

  // reasonable column widths
  ws['!cols'] = [
    {wch:16},{wch:18},{wch:18},{wch:22},
    {wch:14},{wch:20},{wch:16},{wch:16},
    {wch:8},{wch:14},{wch:14},{wch:10}
  ];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'الكاميرات');

  const dateStr = new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb, `سجل_الكاميرات_${dateStr}.xlsx`);
}

loadCameras();
</script>
